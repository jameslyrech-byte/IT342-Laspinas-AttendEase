      JWT_SECRET: your-super-secret-key-change-this-in-production
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendease-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: attendease-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    networks:
      - attendease-network

volumes:
  postgres_data:

networks:
  attendease-network:
    driver: bridge
